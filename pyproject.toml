[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rakuten-trader"
version = "0.1.0"
description = "楽天証券向け自動売買アシスト（Mac: シグナル通知 / ペーパートレード）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kippei" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
rss = ["xlwings>=0.31; platform_system=='Windows'"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
rakuten-trader = "rakuten_trader.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
